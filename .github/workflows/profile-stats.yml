name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # Generate Signal Field
      # ==============================
      - name: Generate signal field
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: signal
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      # ==============================
      # Generate Language Composition
      # ==============================
      - name: Generate language composition
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        id: languages
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      # ==============================
      # Copy generated SVGs
      # ==============================
      - name: Copy profile stats
        env:
          SIGNAL_DIR: ${{ steps.signal.outputs.ready-dir }}
          LANGUAGES_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile

          cp "$SIGNAL_DIR"/signal-field-*.svg profile/
          cp "$LANGUAGES_DIR"/language-composition-*.svg profile/

          # Check that all expected files exist
          test -s profile/signal-field-wide-light.svg
          test -s profile/signal-field-wide-dark.svg
          test -s profile/signal-field-compact-light.svg
          test -s profile/signal-field-compact-dark.svg

          test -s profile/language-composition-wide-light.svg
          test -s profile/language-composition-wide-dark.svg
          test -s profile/language-composition-compact-light.svg
          test -s profile/language-composition-compact-dark.svg

          git add profile/

      # ==============================
      # Commit and push
      # ==============================
      - name: Commit changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update profile stats"
          git push